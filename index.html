<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belle's Bachelorette · Party Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--pink:#f4a9c8;--pink2:#ffe5ef;--pink3:#fff4f8;--ink:#332b31;--muted:#857780;--line:#f1e4eb;--green:#bde8cb;--red:#f5b8bd;--orange:#f8d4a2;--lav:#e8ddf8;--white:#fff;--shadow:0 12px 35px #6e405414}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px 'DM Sans',sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff9fc;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column}.brand{padding:0 10px 24px;border-bottom:1px solid var(--line)}.brand .flower{font-size:25px}.brand h1{font:700 20px 'Playfair Display',serif;margin:8px 0 4px}.brand p{margin:0;color:var(--muted);font-size:12px}.side-label{font-size:10px;font-weight:800;color:#a6919d;letter-spacing:1.4px;margin:23px 10px 9px;text-transform:uppercase}.nav-btn,.person-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;font-weight:600;display:flex;gap:9px;align-items:center}.nav-btn:hover,.person-btn:hover{background:var(--pink3)}.nav-btn.active,.person-btn.active{background:var(--pink2);color:#8e3c64}.person-list{display:grid;gap:3px}.avatar{width:27px;height:27px;border-radius:50%;background:#f9d5e5;display:inline-grid;place-items:center;font-size:13px;flex:none}.person-btn .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{margin-left:auto;font-size:11px;color:#aa96a1}.add-person{margin:10px 3px;border:1px dashed #e7c2d1;background:#fff;border-radius:11px;padding:10px;color:#98536f;font-weight:700}.sidebar-foot{margin-top:auto;padding:15px 10px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px}.crumb{color:var(--muted);font-size:13px}.topbadge{background:#f1eafe;padding:8px 12px;border-radius:30px;font-size:12px;font-weight:700;color:#74589a}.content{max-width:1120px;padding:34px 40px 70px;margin:auto}.hero{background:linear-gradient(110deg,#fff0f6,#fff9fc 55%,#f7f1ff);border:1px solid #fae3ed;border-radius:22px;padding:29px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{color:#a04b72;text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:800}.hero h2{font:700 31px 'Playfair Display',serif;margin:8px 0}.hero p{margin:0;color:var(--muted);max-width:620px;line-height:1.6}.hero-emoji{font-size:55px;white-space:nowrap}.section-title{display:flex;justify-content:space-between;align-items:end;margin:27px 0 13px}.section-title h3{font:700 20px 'Playfair Display',serif;margin:0}.section-title p{color:var(--muted);margin:5px 0 0;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.card h4{margin:0 0 4px;font-size:15px}.card .sub{color:var(--muted);font-size:12px;margin:0 0 19px}.chart-list{display:grid;gap:14px}.chart-row{display:grid;grid-template-columns:minmax(90px,132px) 1fr 36px;gap:10px;align-items:center;font-size:12px}.chart-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:13px;background:#f8f2f5;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#f3afd0,#f6cee0);transition:width .25s}.pct{text-align:right;color:#826b78;font-weight:700;font-size:11px}.empty-chart{font-size:12px;color:#a48e99;padding:5px 0}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.calendar-wrap{background:white;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow)}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.cal-head h4{margin:0;font:700 18px 'Playfair Display',serif}.cal-nav{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:#9a8791;font-size:10px;font-weight:800;padding:6px}.day{position:relative;min-height:67px;border:1px solid #f1e8ed;border-radius:11px;padding:7px;font-size:11px;background:#fff}.day.blank{border-color:transparent}.day .num{font-weight:700}.day .avail{font-size:10px;color:#79666f;margin-top:9px}.day.good{background:#e7f7eb;border-color:#c8e9d0}.day.mixed{background:#fff3de;border-color:#f5dfba}.day.bad{background:#fff0f0;border-color:#f2d4d5}.day .bow{position:absolute;right:6px;top:5px}.calendar-note{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 2px 0}.people-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.people-head h2{font:700 27px 'Playfair Display',serif;margin:0}.person-layout{display:grid;grid-template-columns:1fr;gap:17px}.form-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}.form-card h3{font:700 18px 'Playfair Display',serif;margin:0 0 6px}.form-card>p{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.5}.field-label{display:block;font-size:12px;font-weight:800;margin:16px 0 9px}.name-edit{display:flex;gap:9px}.name-edit input{flex:1;min-width:0}.input{padding:11px 12px;border:1px solid #eadce3;border-radius:10px;background:#fff;width:100%;outline:0}.input:focus{border-color:#eaa1bf;box-shadow:0 0 0 3px #fce7f0}.primary{border:0;background:#d77ca3;color:#fff;border-radius:10px;padding:11px 17px;font-weight:800}.primary:hover{background:#c6648f}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700}.options{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #eee0e7;background:#fff;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:600}.chip.selected{background:#ffebf3;border-color:#eaa7c2;color:#8c4162}.choice-row{display:flex;gap:10px}.choice{flex:1;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px}.choice.selected{border-color:#dc8fb0;background:#fff0f6}.choice b{display:block;margin-bottom:3px}.choice small{color:var(--muted)}.nope{margin-top:15px;background:#fff2f3;border:1px solid #f4dcdf;border-radius:12px;padding:15px;line-height:1.6}.calendar-mini{margin-top:20px}.calendar-mini .day{min-height:54px;cursor:pointer}.calendar-mini .day:hover{outline:2px solid #edb3cb}.calendar-mini .day .avail{font-size:9px;margin-top:6px}.resources{display:grid;grid-template-columns:1fr;gap:12px}.resource-card{border:1px solid var(--line);background:white;padding:17px;border-radius:14px}.resource-card .task{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#a24f74;font-weight:800}.resource-card h4{margin:7px 0 6px}.resource-card p{font-size:12px;color:var(--muted);line-height:1.5}.resource-card a{color:#a34d76;font-weight:700;font-size:12px}.resource-empty{padding:22px;border:1px dashed #e8cad7;border-radius:15px;background:#fffafe;color:#786873;line-height:1.6;font-size:13px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#352a31;color:white;border-radius:30px;padding:11px 17px;font-size:12px;box-shadow:var(--shadow)}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{padding:15px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 5px 12px}.brand h1{display:inline-block;margin:0 0 0 8px}.brand p{margin-left:43px}.side-label{margin:13px 5px 5px}.person-list{display:flex;overflow:auto}.person-btn{width:auto;min-width:130px}.nav-btn{width:auto;display:inline-flex}.sidebar nav{display:flex;gap:5px}.sidebar-foot{display:none}.topbar{height:55px;padding:0 17px}.content{padding:20px 15px 45px}.hero{padding:22px;border-radius:17px}.hero h2{font-size:26px}.hero-emoji{font-size:38px}.grid2{grid-template-columns:1fr}.day{min-height:53px;padding:5px}.day .avail{font-size:9px}.calendar-wrap{padding:12px}.cal-grid{gap:4px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="flower">💐</span><h1>Belle's Bachelorette</h1><p>A little party planning, a lot of love</p></div><div class="side-label">Workspace</div><nav><button class="nav-btn active" data-view="main">✨ &nbsp; Main dashboard</button><button class="nav-btn" data-view="resources">🧷 &nbsp; Planning resources</button></nav><div class="side-label">Guest list <span id="guestCount" class="count"></span></div><div id="people" class="person-list"></div><button id="addPerson" class="add-person">＋ Add your name</button><div class="sidebar-foot">Your answers save on this device.<br>Up to 8 guests, including Belle.</div></aside><main class="main"><div class="topbar"><div class="crumb" id="crumb">Party planning / Main</div><div class="topbadge">💗 Nov 27, 2026 — Jan 25, 2027</div></div><div class="content"><section id="dashboard"></section><section id="profile" class="hidden"></section><section id="resources" class="hidden"></section></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const BRIDE='Belle💐👰🏻‍♀️💍♡', STORAGE='belle-party-v1';
const formats=['Just lunch','Just dinner','Just night party','Overnight'];
const places=['Bangkok','Outside Bangkok','Somewhere else'];
const dayStart=new Date(2026,10,27), dayEnd=new Date(2027,0,25);
let data;try{data=JSON.parse(localStorage.getItem(STORAGE))}catch{};
if(!data||!Array.isArray(data.people)){data={people:[{id:'bride',name:BRIDE,yes:true,formats:['Just dinner'],places:['Bangkok'],availability:{}}],active:'bride'}}
data.people=data.people.slice(0,8); if(!data.people.some(p=>p.id==='bride'))data.people.unshift({id:'bride',name:BRIDE,yes:null,formats:[],places:[],availability:{}});if(data.people.length>8)data.people=data.people.slice(0,8);
let view='main',month=new Date(2026,10,1);const $=s=>document.querySelector(s);const save=()=>localStorage.setItem(STORAGE,JSON.stringify(data));const activePerson=()=>data.people.find(p=>p.id===data.active)||data.people[0];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function days(){let a=[];for(let d=new Date(dayStart);d<=dayEnd;d.setDate(d.getDate()+1))a.push(new Date(d));return a}
function render(){renderPeople();$('#dashboard').classList.toggle('hidden',view!=='main');$('#profile').classList.toggle('hidden',view!=='profile');$('#resources').classList.toggle('hidden',view!=='resources');$('#crumb').textContent='Party planning / '+(view==='main'?'Main':view==='resources'?'Planning resources':activePerson().name);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='main')renderDashboard();if(view==='profile')renderProfile();if(view==='resources')renderResources()}
function renderPeople(){let wrap=$('#people');wrap.innerHTML=data.people.map(p=>`<button class="person-btn ${view==='profile'&&data.active===p.id?'active':''}" data-person="${p.id}"><span class="avatar">${p.id==='bride'?'👰🏻‍♀️':'💗'}</span><span class="name">${esc(p.name)}</span>${p.id==='bride'?'<span class="count">BRIDE TO BE</span>':''}</button>`).join('');$('#guestCount').textContent=`${data.people.length}/8`;$('#addPerson').disabled=data.people.length>=8;$('#addPerson').style.opacity=data.people.length>=8?'.45':'1';wrap.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{data.active=b.dataset.person;view='profile';render()})}
function monthCal(target,interactive=false){let first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),p=target;let html='<div class="cal-head"><button class="cal-nav" data-month="-1">‹</button><h4>'+month.toLocaleString('en',{month:'long',year:'numeric'})+'</h4><button class="cal-nav" data-month="1">›</button></div><div class="cal-grid">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<offset;i++)html+='<div class="day blank"></div>';for(let n=1;n<=count;n++){let d=new Date(month.getFullYear(),month.getMonth(),n),key=dateKey(d),state=p?.availability?.[key]||'',valid=d>=dayStart&&d<=dayEnd,dayPeople=data.people.filter(x=>x.yes===true),avail=dayPeople.filter(x=>x.availability?.[key]==='green').length,total=dayPeople.length;let cls=state==='green'?'good':state==='red'?'bad':'';let overall=total&&avail===total?'good':avail?'mixed':'';if(!interactive&&valid)cls=overall;let brideAvailable=data.people.find(x=>x.id==='bride')?.availability?.[key]==='green';let bow=brideAvailable?'🎀':'';let label=interactive?(state==='green'?'Available':state==='red'?'Unavailable':'Not sure'):`${avail}/${total} available`;html+=`<div class="day ${valid?'':'blank'} ${cls}" ${interactive&&valid?`data-day="${key}"`:''}><span class="num">${n}</span>${bow?`<span class="bow">${bow}</span>`:''}${valid?`<div class="avail">${label}</div>`:''}</div>`}html+='</div>';return html}
function wireCalendar(root,p,interactive=false){root.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{month.setMonth(month.getMonth()+Number(b.dataset.month));render()});root.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{let key=el.dataset.day,cur=p.availability[key]||'';p.availability[key]=cur===''?'green':cur==='green'?'red':'';save();render()})}
function renderDashboard(){let yes=data.people.filter(p=>p.yes===true);let fmt=chart(formats,yes,'formats'),loc=chart(places,yes,'places');$('#dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow">The countdown starts here</div><h2>Let's celebrate Belle! 💍</h2><p>Help us find a date and a vibe that works for everyone. Add your name, share your preferences, and mark the days you can make it.</p></div><div class="hero-emoji">🥂💐</div></div><div class="grid2"><div class="card"><h4>Party format</h4><p class="sub">What everyone is in the mood for</p><div class="chart-list">${fmt}</div></div><div class="card"><h4>Where should we celebrate?</h4><p class="sub">Guests can select more than one place</p><div class="chart-list">${loc}</div></div></div><div class="section-title"><div><h3>Availability calendar</h3><p>Each square shows how many guests can make that date.</p></div><div class="legend"><span><i class="dot" style="background:#bde8cb"></i>Everyone available</span><span><i class="dot" style="background:#f8d4a2"></i>Some available</span><span><i class="dot" style="background:#f5b8bd"></i>No one marked available</span></div></div><div class="calendar-wrap" id="mainCal">${monthCal()}</div><p class="calendar-note">Only guests who said yes are counted. A full green day means every yes RSVP is marked available. Belle's green dates are tagged with 🎀. Unmarked dates are still a maybe.</p><div class="section-title"><div><h3>Planning resources</h3><p>Handy links to help bring the celebration together.</p></div><button class="secondary" id="resourcesLink">See resources →</button></div><div id="resource-preview"></div>`;wireCalendar($('#mainCal'));$('#resourcesLink').onclick=()=>{view='resources';render()};renderResourcePreview()}
function chart(labels,people,field){if(!people.length)return '<div class="empty-chart">No yes RSVPs yet — preferences will appear here as guests respond.</div>';return labels.map((l,i)=>{let c=people.filter(p=>(p[field]||[]).includes(l)).length,pct=Math.round(c/people.length*100);return `<div class="chart-row"><span class="chart-label">${l}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>`}).join('')}
function chips(arr,selected,cb){return `<div class="options">${arr.map((x,i)=>`<button class="chip ${(selected||[]).includes(x)?'selected':''}" data-opt="${i}">${x}</button>`).join('')}</div>`}
function renderProfile(){let p=activePerson();$('#profile').innerHTML=`<div class="people-head"><div><div class="eyebrow">Guest response ${p.id==='bride'?'· Bride':'· Guest'}</div><h2>${esc(p.name)}</h2></div>${p.id==='bride'?'<span class="topbadge">👰🏻‍♀️ Bride & calendar lead</span>':''}</div><div class="form-card"><h3>Your details</h3><p>Your answers save automatically on this device. You can come back and change them any time.</p><label class="field-label" for="nameInput">Name</label><div class="name-edit"><input id="nameInput" class="input" value="${esc(p.name)}" maxlength="40"><button class="primary" id="saveName">Save name</button></div><label class="field-label">Are you coming to the bachelorette?</label><div class="choice-row"><button class="choice ${p.yes===true?'selected':''}" data-rsvp="yes"><b>Yes, count me in! 🥂</b><small>Show me the party planning</small></button><button class="choice ${p.yes===false?'selected':''}" data-rsvp="no"><b>I can't make it 😭</b><small>Maybe things will change</small></button></div>${p.yes===false?'<div class="nope">😭😭😭 We’ll miss you! Come back if you change your mind — you can update your RSVP anytime. 💗</div>':''}${p.yes===true?`<label class="field-label">What kind of celebration sounds good? <span style="color:#9a8791;font-weight:400">(choose all that apply)</span></label>${chips(formats,p.formats)}<label class="field-label">Where would you like to celebrate? <span style="color:#9a8791;font-weight:400">(choose all that apply)</span></label>${chips(places,p.places)}${p.places?.includes('Somewhere else')?`<input id="otherPlace" class="input" style="margin-top:9px;max-width:420px" placeholder="Your preferred place — anywhere goes" value="${esc(p.otherPlace||'')}">`:''}<div class="section-title"><div><h3>Mark your availability</h3><p>Tap a date to cycle through available → unavailable → not sure.</p></div></div><div class="legend"><span><i class="dot" style="background:#bde8cb"></i>Available</span><span><i class="dot" style="background:#f5b8bd"></i>Unavailable for sure</span><span><i class="dot" style="background:#eee7eb"></i>Not sure / unmarked</span></div><div class="calendar-wrap calendar-mini" id="profileCal">${monthCal(p,true)}</div><p class="calendar-note">Mark green when you prefer that date or know you are available. Red means you are definitely unavailable. Leave a day unmarked if you are not sure yet. You can edit this anytime.</p>`:''}</div>`;$('#saveName').onclick=()=>{let v=$('#nameInput').value.trim();if(!v){toast('Please enter a name first.');return}if(data.people.some(x=>x.id!==p.id&&x.name.toLowerCase()===v.toLowerCase())){toast('That name is already on the guest list.');return}p.name=v;save();render()};$('#nameInput').onkeydown=e=>{if(e.key==='Enter')$('#saveName').click()};$('#profile').querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=()=>{p.yes=b.dataset.rsvp==='yes';save();render()});$('#profile').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let arr=b.closest('.options').previousElementSibling.textContent.includes('celebration')?p.formats:p.places;if(!Array.isArray(arr))arr=[];let v=(b.closest('.options').previousElementSibling.textContent.includes('celebration')?formats:places)[Number(b.dataset.opt)];arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];if(b.closest('.options').previousElementSibling.textContent.includes('celebration'))p.formats=arr;else p.places=arr;save();render()});let op=$('#otherPlace');if(op)op.oninput=()=>{p.otherPlace=op.value;save()};let cal=$('#profileCal');if(cal)wireCalendar(cal,p,true)}
function renderResources(){let r=$('#resources');r.innerHTML=`<div class="hero"><div><div class="eyebrow">The helpful bits</div><h2>Planning resources 🧷</h2><p>Ideas, guides, and useful links for putting together Belle's celebration.</p></div><div class="hero-emoji">📋✨</div></div><div id="resource-content"></div>`;renderResourcePreview()}
function renderResourcePreview(){let el=$('#resource-preview')||$('#resource-content');if(!el)return;el.innerHTML='<div class="resource-empty"><b>Resource list coming soon</b><br>When you have planning links to add, this area will show each item with its title, description, task label, and source link. No resource list was attached, so nothing has been invented here.</div>'}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#addPerson').onclick=()=>{if(data.people.length>=8){toast('The guest list is full (8 people maximum).');return}let p={id:'guest-'+Date.now(),name:'New guest',yes:null,formats:[],places:[],availability:{}};data.people.push(p);data.active=p.id;view='profile';save();render();$('#nameInput').select()};render();
</script></body></html>
